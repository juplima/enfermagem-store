<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Enfermagem Store</title>

    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="../../index.html">Enfermagem Store</a>
    </div>
</nav>

<!-- CHECKOUT -->
<div class="container my-5">

    <h2 class="fw-bold mb-4 text-center">Finalizar Compra</h2>

    <div class="row">
        
        <!-- FORMULÁRIO -->
        <div class="col-md-7 mb-4">

            <h4 class="fw-bold mb-3">Endereço de Entrega</h4>

            <form id="checkout-form">

                <div class="mb-3">
                    <label class="form-label">Nome completo</label>
                    <input type="text" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Endereço</label>
                    <input type="text" class="form-control" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Cidade</label>
                        <input type="text" class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">CEP</label>
                        <input type="text" class="form-control" required>
                    </div>
                </div>

                <h4 class="fw-bold mt-4 mb-3">Método de Pagamento</h4>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="pagamento" checked>
                    <label class="form-check-label">Cartão de Crédito</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="pagamento">
                    <label class="form-check-label">PIX</label>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="radio" name="pagamento">
                    <label class="form-check-label">Boleto Bancário</label>
                </div>

                <button type="submit" class="btn btn-success w-100 btn-lg mt-3">
                    Confirmar Pedido
                </button>

            </form>

        </div>

        <!-- RESUMO DO PEDIDO -->
        <div class="col-md-5">

            <div class="card shadow-sm">
                <div class="card-body">

                    <h4 class="fw-bold mb-3">Resumo do Pedido</h4>

                    <div id="checkout-items"></div>

                    <hr>

                    <h4 class="fw-bold text-end">
                        Total: <span id="checkout-total">R$ 0,00</span>
                    </h4>

                </div>
            </div>

        </div>
    </div>

</div>

<!-- FOOTER -->
<footer class="text-center py-3 bg-light mt-5">
    <p class="mb-0">© 2025 Enfermagem Store</p>
</footer>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/script.js"></script>

</body>
</html>
