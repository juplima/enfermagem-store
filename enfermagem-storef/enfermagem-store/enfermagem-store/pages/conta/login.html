<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Enfermagem Store</title>

    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="../../index.html">Enfermagem Store</a>
    </div>
</nav>

<div class="container my-5">

    <h2 class="text-center fw-bold mb-4">Login</h2>

    <div class="card shadow-sm p-4 mx-auto" style="max-width: 500px;">

        <form id="loginForm">

            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" class="form-control" id="loginEmail" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" class="form-control" id="loginSenha" required>
            </div>

            <button class="btn btn-primary w-100 mt-3" type="submit">Entrar</button>

        </form>

        <p class="text-center mt-3">
            Não tem conta? <a href="cadastro.html">Criar conta</a>
        </p>

    </div>

</div>

<script src="../../assets/js/script.js"></script>

</body>
</html>
