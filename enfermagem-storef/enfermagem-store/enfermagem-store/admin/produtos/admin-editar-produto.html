<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Produto - Admin</title>

    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body>

<div class="container my-5">

    <h2 class="fw-bold text-center mb-4">Editar Produto</h2>

    <div class="card shadow-sm p-4 mx-auto" style="max-width: 500px;">

        <form id="editProductForm">

            <div class="mb-3">
                <label class="form-label">Nome do Produto</label>
                <input type="text" class="form-control" id="editNome" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Preço</label>
                <input type="number" class="form-control" id="editPreco" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Imagem (URL)</label>
                <input type="text" class="form-control" id="editImg" required>
            </div>

            <button class="btn btn-success w-100 mt-3" type="submit">Salvar Alterações</button>

            <a href="admin-produtos.html" class="btn btn-secondary w-100 mt-3">Voltar</a>

        </form>

    </div>

</div>

<script src="../../assets/js/script.js"></script>

<script>
// Quando a página carregar, preencher com os dados do produto a ser editado
document.addEventListener("DOMContentLoaded", () => {

    const index = localStorage.getItem("editProductIndex");
    if (index === null) {
        alert("Erro: produto não encontrado.");
        window.location.href = "admin-produtos.html";
        return;
    }

    const products = JSON.parse(localStorage.getItem("adminProducts")) || [];
    const produto = products[index];

    // Preencher os inputs
    document.getElementById("editNome").value = produto.nome;
    document.getElementById("editPreco").value = produto.preco;
    document.getElementById("editImg").value = produto.imagem;
});
</script>

</body>
</html>
