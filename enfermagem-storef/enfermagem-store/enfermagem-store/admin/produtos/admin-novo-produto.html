<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Produto - Admin</title>

    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body>

<div class="container my-5">

    <h2 class="fw-bold text-center mb-4">Adicionar Produto</h2>

    <div class="card shadow-sm p-4 mx-auto" style="max-width: 500px;">

        <form id="newProductForm">

            <div class="mb-3">
                <label class="form-label">Nome do Produto</label>
                <input type="text" class="form-control" id="prodNome" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Preço</label>
                <input type="number" class="form-control" id="prodPreco" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Imagem (URL)</label>
                <input type="text" class="form-control" id="prodImg" required>
            </div>

            <button class="btn btn-success w-100 mt-3" type="submit">Adicionar</button>

        </form>

    </div>

</div>

<script src="../../assets/js/script.js"></script>

</body>
</html>
