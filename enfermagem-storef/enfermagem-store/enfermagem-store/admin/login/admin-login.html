<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Enfermagem Store</title>

    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body>

<div class="container my-5">

    <h2 class="text-center fw-bold mb-4">Acesso do Administrador</h2>

    <div class="card shadow-sm p-4 mx-auto" style="max-width: 400px;">
        
        <form id="adminLoginForm">

            <div class="mb-3">
                <label class="form-label">Usuário</label>
                <input type="text" class="form-control" id="adminUser" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" class="form-control" id="adminSenha" required>
            </div>

            <button class="btn btn-dark w-100 mt-3" type="submit">Entrar</button>

        </form>

    </div>

</div>

<script src="../../assets/js/script.js"></script>
</body>
</html>
